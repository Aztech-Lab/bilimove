[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-moving"
version = "0.1.0"
description = "科研项目：agent 网页端适配研究 — YouTube → B站 全自动搬运流水线（下载、转码、汉化、仅自己可见上传）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 可视化（封面 + 动态频谱曲线）扩展
visualizer = [
    "muvid>=0.0.34",
]

[project.scripts]
video-moving-monitor = "src.monitor:main"
video-moving-pipeline = "src.pipeline:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-q"
